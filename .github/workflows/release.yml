# Release on a v* tag push: the shared workflow cross-builds, publishes the
# GitHub Release, and regenerates + pushes the Homebrew formula. To release:
#   git tag vX.Y.Z && git push origin vX.Y.Z
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    uses: shhac/homebrew-tap/.github/workflows/go-release.yml@main
    permissions:
      contents: write
    secrets: inherit
    with:
      name: agent-mongo
      desc: "Read-only MongoDB CLI for AI agents"
      formula_class: AgentMongo
      help_match: "Read-only MongoDB CLI for AI agents"
      license: "LicenseRef-PolyForm-Perimeter-1.0.0"
